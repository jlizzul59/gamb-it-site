<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Recettes du semainier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête collant ; à gauche les ingrédients à cocher, à droite les recettes qui restent (pile sur mobile) */
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --ink:#1C2A20; --muted:#5B6A5F; --line:#D6DFD3;
  --accent:#2D6A42; --accent-ink:#FFFFFF; --accent-soft:#E2EEE4;
  --warm:#B85A14; --warm-soft:#F7E8DA; --bad:#A2372A; --bad-soft:#F6E2DE;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121915; --surface:#1A231E; --ink:#E4EBE3; --muted:#9AA89D; --line:#2C3830;
  --accent:#7DC497; --accent-ink:#0F1A13; --accent-soft:#1F3327;
  --warm:#EB9A5E; --warm-soft:#3A2919; --bad:#E58072; --bad-soft:#3B2220; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1A231E; --ink:#E4EBE3; --muted:#9AA89D; --line:#2C3830;
  --accent:#7DC497; --accent-ink:#0F1A13; --accent-soft:#1F3327;
  --warm:#EB9A5E; --warm-soft:#3A2919; --bad:#E58072; --bad-soft:#3B2220; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.top h1{font-size:24px}
.back{margin-left:auto;text-decoration:none;font-weight:600;font-size:14px;color:var(--accent);padding:7px 14px;border-radius:999px;border:1px solid var(--accent)}
.back:hover{background:var(--accent-soft)}
main{padding-block:24px 64px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}
.side h2{font-size:20px;margin-bottom:4px}
.side>p{margin:0 0 14px;font-size:13px;color:var(--muted)}
#toggleFacets{display:none}
.fgroup{margin-bottom:16px}
.fgroup h3{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.fchip .fc{font-size:11px;background:var(--bg);border-radius:999px;padding:0 6px;color:var(--muted)}
.fchip:hover:not(:disabled){border-color:var(--accent)}
.fchip.in{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.fchip.in .fc{background:color-mix(in srgb,var(--accent-ink) 25%,transparent);color:var(--accent-ink)}
.fchip.out{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fchip.out .fc{background:transparent;color:var(--bad);text-decoration:none}
.fchip:disabled{opacity:.38;cursor:default}
.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.search input{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.qf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--ink)}
#count{font-size:15px}
#count b{font-size:20px}
#active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.pill{border:0;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.pill.in{background:var(--accent-soft);color:var(--accent)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.clear{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:13px}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card:hover{border-color:var(--accent)}
.cname{font-weight:700;font-size:15px;line-height:1.3}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.cing{font-size:13px;color:var(--muted)}
.cing mark{background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:3px;padding:0 2px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.tag.plaisir{background:var(--warm-soft);color:var(--warm)}
.tag.vege{background:var(--accent-soft);color:var(--accent)}
.none{grid-column:1/-1;padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.none b{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;position:relative}
.close{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-weight:600}
.rhead h3{font-size:24px;padding-right:80px}
.rfacts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.serv{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.sb{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.serv b{min-width:2ch;text-align:center;font-size:18px}
.rbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
.rbody h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ings{list-style:none;margin:0;padding:0;font-size:14px}
.ings li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.ings .num{color:var(--accent);text-align:right}
.steps{margin:0;padding-left:20px;font-size:14px}
.steps li{margin-bottom:6px}
.bcnote{margin-top:12px;font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.bcnote b{color:var(--accent)}
.kid{font-size:13px;background:var(--warm-soft);border-radius:8px;padding:8px 12px}
.kid b{color:var(--warm)}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .side{position:static;max-height:none;overflow:visible;padding:0}
  #toggleFacets{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;margin-bottom:8px}
  #facetPanel{display:none}
  #facetPanel.open{display:block}
}
@media (max-width:560px){.rbody{grid-template-columns:1fr}}
</style>

<header class="top"><div class="wrap">
  <h1>Toutes les recettes</h1>
  <a class="back" href="index.html">← Semainier</a>
</div></header>

<main class="wrap">
  <aside class="side">
    <h2>Ingrédients</h2>
    <p>Le chiffre indique combien de recettes restent si vous l'ajoutez. Une fois = avec, deux fois = sans, trois fois = retiré.</p>
    <button type="button" id="toggleFacets" aria-expanded="false" aria-controls="facetPanel">Choisir des ingrédients</button>
    <div id="facetPanel"><div id="facets"></div></div>
  </aside>
  <section class="content">
    <label class="search"><input type="search" id="q" placeholder="Rechercher : gratin, curry, saumon…" autocomplete="off" aria-label="Rechercher une recette"></label>
    <div class="bar" id="quick"></div>
    <div class="status"><div id="count"></div><div id="active"></div></div>
    <div id="results"></div>
  </section>
</main>
<div class="overlay" id="overlay" hidden></div>

// for: l2 = midi à 2 en semaine, fam = repas familial à 4
const R=[
 {id:"tikka",n:"Poulet tikka masala léger, riz basmati",for:["fam"],p:"poulet",t:35,ing:[["poulet",130],["yaourt",50],["tomatecc",100],["oignon",40],["ail",0.5],["curry",1],["creme",15],["riz",50],["huile",0.25]],

 {id:"hachis",n:"Hachis parmentier allégé au chou-fleur",for:["fam"],p:"boeuf",t:50,ing:[["boeuf",110],["pdt",150],["choufleur",150],["carotte",50],["oignon",40],["lait",50],["emmental",15]],

 {id:"nuggets",n:"Nuggets de poulet au four, frites maison",for:["fam"],p:"poulet",t:40,tag:"plaisir",ing:[["poulet",130],["cornflakes",25],["oeuf",0.3],["paprika",0.5],["pdt",200],["huile",0.5],["carotte",80],["citron",0.1]],

 {id:"veloute",n:"Velouté de potiron et croque-monsieur",for:["fam","l2"],p:"jambon",t:35,ing:[["potiron",250],["pdt",50],["oignon",30],["bouillon",0.25],["creme",10],["painmie",2],["jambon",30],["emmental",15]],

 {id:"pizza",n:"Pizza maison jambon-champignons, salade verte",for:["fam"],p:"jambon",t:30,tag:"plaisir",ing:[["patepizza",80],["tomatecc",60],["mozza",50],["jambon",40],["champignons",60],["herbes",0.5],["salade",40]],
  st:["Préchauffer le four à 230 °C. Dérouler la pâte sur sa feuille.","Étaler les tomates concassées assaisonnées d'herbes.","Répartir jambon, champignons émincés et mozzarella.","Cuire 12 à 15 min. Servir avec la salade."],kid:"Laissez-les garnir leur part eux-mêmes."},

const PO={c:"cru",o:"four",f:"feu",g:"gel"};
MORE.forEach(([id,n,f,p,t,tag,ing,st,bc,j,kid])=>{
  const r={id,n,for:f==="B"?["fam","l2"]:f==="L"?["l2"]:["fam"],p,t,ing:ing.split(",").map(x=>{const[a,b]=x.split(":");return[a,+b]}),st};
  if(tag==="P")r.tag="plaisir"; if(kid)r.kid=kid;
  R.push(r);RB[id]=r;
  BC[id]={t:bc?bc.split("|").map(x=>[PO[x[0]],x.slice(2)]):[],j};
});

// ---------- Page recettes : filtres par ingrédients ----------
const BASICS=new Set(["oignon","ail","citron","persil"]);
const GROUP_ORDER=["Viandes","Poissons & crevettes","Œufs & légumineuses","Légumes","Féculents","Fromages & crème","Autres"];
const isVege=r=>!r.ing.some(([id])=>I[id].c==="Viandes"||I[id].c==="Poissons & crevettes");
const kcal=r=>Math.round(r.ing.reduce((a,[id,q])=>a+q*I[id].k,0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const frac=x=>{const w=Math.floor(x),h=x-w;return ((w?w:"")+(h>=0.5?(w?" ½":"½"):""))||"0"};
function fmt(q,u){
  if(u==="g"||u==="ml"){const v=Math.max(5,Math.round(q/5)*5);if(v>=1000)return (Math.round(v/100)/10).toString().replace(".",",")+(u==="g"?" kg":" L");return v+" "+u}
  const v=Math.max(0.5,Math.round(q*2)/2);
  if(u==="cs")return frac(v)+" c. à s.";if(u==="cc")return frac(v)+" c. à c.";
  if(u==="gousse")return frac(v)+(v>1?" gousses":" gousse");if(u==="bouquet")return frac(v)+(v>1?" bouquets":" bouquet");
  return frac(v);
}
const groupOf=id=>I[id].c||"Autres";
const facetIds=[...new Set(R.flatMap(r=>r.ing.map(([id])=>id)))].filter(id=>I[id].r!=="pl"&&!BASICS.has(id));

// état
let sel={};      // id -> 1 (avec) | -1 (sans)
let quick=new Set(), q="", servings=4;
try{const s=JSON.parse(localStorage.getItem("recettes.filtres")||"null");if(s){sel=s.sel||{};quick=new Set(s.quick||[]);servings=s.servings||4}}catch(e){}
function save(){try{localStorage.setItem("recettes.filtres",JSON.stringify({sel,quick:[...quick],servings}))}catch(e){}}

const QUICK=[["vege","Végétarien",r=>isVege(r)],["plaisir","Plaisir",r=>r.tag==="plaisir"],["rapide","25 min ou moins",r=>r.t<=25],["emporter","Midi à emporter",r=>r.for.includes("l2")],["leger","Moins de 400 kcal",r=>kcal(r)<400]];
const has=(r,id)=>r.ing.some(([x])=>x===id);
function matches(r,extra){
  for(const [id,v] of Object.entries(sel)){if(v===1&&!has(r,id))return false;if(v===-1&&has(r,id))return false}
  if(extra&&!has(r,extra))return false;
  for(const k of quick){const f=QUICK.find(x=>x[0]===k);if(f&&!f[2](r))return false}
  if(q){const t=norm(r.n+" "+r.ing.map(([id])=>I[id].n).join(" "));if(!norm(q).split(/\s+/).every(w=>t.includes(w)))return false}
  return true;
}

function render(){
  const res=R.filter(r=>matches(r)).sort((a,b)=>a.n.localeCompare(b.n,"fr"));
  // compte
  document.getElementById("count").innerHTML=`<b class="num">${res.length}</b> recette${res.length>1?"s":""} sur ${R.length}`;
  // filtres actifs
  const act=Object.entries(sel).map(([id,v])=>`<button type="button" class="pill ${v===1?"in":"out"}" data-rm="${id}" aria-label="Retirer ${esc(I[id].n)}">${v===1?"Avec":"Sans"} ${esc(I[id].n.toLowerCase())} <span aria-hidden="true">×</span></button>`).join("");
  document.getElementById("active").innerHTML=act?act+`<button type="button" class="clear" id="clearAll">Tout effacer</button>`:'<span class="muted">Touchez un ingrédient : 1 fois pour « avec », 2 fois pour « sans ».</span>';
  // filtres rapides
  document.getElementById("quick").innerHTML=QUICK.map(([k,l])=>`<button type="button" class="qf" data-q="${k}" aria-pressed="${quick.has(k)}">${l}</button>`).join("");
  // facettes
  const groups={};
  facetIds.forEach(id=>(groups[groupOf(id)]=groups[groupOf(id)]||[]).push(id));
  document.getElementById("facets").innerHTML=GROUP_ORDER.filter(g=>groups[g]).map(g=>{
    const chips=groups[g].sort((a,b)=>I[a].n.localeCompare(I[b].n,"fr")).map(id=>{
      const v=sel[id];
      const n=v?res.filter(r=>has(r,id)).length:res.filter(r=>has(r,id)).length;
      const dis=!v&&n===0;
      return `<button type="button" class="fchip ${v===1?"in":v===-1?"out":""}" data-f="${id}" ${dis?"disabled":""} aria-label="${esc(I[id].n)}${v===1?" (avec)":v===-1?" (sans)":""}, ${n} recettes"><span>${esc(I[id].n)}</span><span class="fc num">${v===-1?"sans":n}</span></button>`;
    }).join("");
    return `<div class="fgroup"><h3>${g}</h3><div class="fchips">${chips}</div></div>`;
  }).join("");
  // résultats
  document.getElementById("results").innerHTML=res.length?res.map(r=>{
    const main=r.ing.filter(([id])=>I[id].r!=="pl"&&!BASICS.has(id)).map(([id])=>sel[id]===1?`<mark>${esc(I[id].n.toLowerCase())}</mark>`:esc(I[id].n.toLowerCase())).join(", ");
    return `<button type="button" class="card" data-r="${r.id}">
      <span class="cname">${esc(r.n)}</span>
      <span class="cmeta"><span class="num">≈ ${kcal(r)} kcal</span><span>${r.t} min</span>${r.tag==="plaisir"?'<span class="tag plaisir">Plaisir</span>':""}${isVege(r)?'<span class="tag vege">Végétarien</span>':""}</span>
      <span class="cing">${main}</span></button>`;
  }).join(""):`<div class="none"><b>Aucune recette avec cette combinaison.</b><br>Retirez un ingrédient ou un filtre pour élargir.</div>`;
}

const ov=document.getElementById("overlay");
function openRecipe(id){
  const r=R.find(x=>x.id===id);if(!r)return;
  const bc=BC[r.id];
  ov.innerHTML=`<article class="rcard"><button class="close" type="button" data-close>Fermer</button>
    <div class="rhead"><h3>${esc(r.n)}</h3>
      <div class="rfacts"><span>${r.t} min</span><span class="num">≈ ${kcal(r)} kcal / portion adulte</span>${r.tag==="plaisir"?'<span class="tag plaisir">Plaisir</span>':""}${isVege(r)?'<span class="tag vege">Végétarien</span>':""}</div></div>
    <div class="serv"><span>Portions</span><button type="button" class="sb" data-s="-1" aria-label="Une portion de moins">−</button><b class="num" id="servN">${servings}</b><button type="button" class="sb" data-s="1" aria-label="Une portion de plus">+</button></div>
    <div class="rbody"><div><h4>Ingrédients</h4><ul class="ings" id="ings"></ul></div>
      <div><h4>Préparation</h4><ol class="steps">${r.st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      <div class="bcnote"><b>En batch cooking :</b> ${bc&&bc.t.length?bc.t.map(t=>esc(t[1])).join(" ; ")+".":"rien à préparer à l'avance."} <b>Le jour J :</b> ${esc(bc?bc.j:"")}</div></div></div>
    ${r.kid?`<div class="kid"><b>Pour les enfants.</b> ${esc(r.kid)}</div>`:""}</article>`;
  ov.dataset.r=id;ov.hidden=false;fillIngs();ov.querySelector("[data-close]").focus();
}
function fillIngs(){
  const r=R.find(x=>x.id===ov.dataset.r);if(!r)return;
  document.getElementById("servN").textContent=servings;
  document.getElementById("ings").innerHTML=r.ing.map(([id,qq])=>`<li><span class="num">${fmt(qq*servings,I[id].u)}</span><span>${esc(I[id].n)}</span></li>`).join("");
}
function closeModal(){ov.hidden=true;ov.innerHTML=""}

document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){const id=f.dataset.f,v=sel[id];if(!v)sel[id]=1;else if(v===1)sel[id]=-1;else delete sel[id];save();render();return}
  const rm=e.target.closest("[data-rm]");if(rm){delete sel[rm.dataset.rm];save();render();return}
  if(e.target.closest("#clearAll")){sel={};quick.clear();q="";document.getElementById("q").value="";save();render();return}
  const qf=e.target.closest("[data-q]");if(qf){const k=qf.dataset.q;quick.has(k)?quick.delete(k):quick.add(k);save();render();return}
  const c=e.target.closest("[data-r]");if(c){openRecipe(c.dataset.r);return}
  const sb=e.target.closest("[data-s]");if(sb){servings=Math.max(1,Math.min(12,servings+ +sb.dataset.s));save();fillIngs();return}
  if(e.target===ov||e.target.closest("[data-close]"))closeModal();
  const tf=e.target.closest("#toggleFacets");if(tf){const p=document.getElementById("facetPanel");p.classList.toggle("open");tf.setAttribute("aria-expanded",p.classList.contains("open"))}
});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden)closeModal()});
render();
</script>
